<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello 跑馬燈</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1b1e26;
    --accent: #4fd1c5;
    --text: #f5f5f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .marquee-wrap {
    width: 100%;
    max-width: 480px;
    overflow: hidden;
    background: #05070a;
    border: 1px solid #2a2e38;
    border-radius: 12px;
    padding: 22px 0;
  }
  .marquee-track {
    display: inline-block;
    white-space: nowrap;
    padding-left: 100%;
    font-size: 28px;
    font-weight: 800;
    color: var(--accent);
    animation: scroll-left 8s linear infinite;
  }
  @keyframes scroll-left {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }
</style>
</head>
<body>
  <div class="marquee-wrap">
    <span class="marquee-track" id="marqueeText">Hello</span>
  </div>

  <script>
    // 之後如果想改內容,直接改這一行文字即可
    document.getElementById('marqueeText').textContent = "Hello";
  </script>
</body>
</html>
